<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#0e0f11"/><link rel="icon" href="/brand/favicon.ico" sizes="any"/><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"/><link rel="apple-touch-icon" href="/brand/icon-192.png"/><meta name="application-name" content="观澜"/><meta name="apple-mobile-web-app-title" content="观澜"/><title>观澜 · 英雄联盟赛事导播</title><script>
// Apply the saved appearance before the UI loads. Broadcast outputs retain their palette.
(function () { try {
  var theme = !location.pathname.startsWith('/overlay') && localStorage.getItem('riftcast-ui-theme') === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.uiTheme = theme;
  document.documentElement.style.colorScheme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#eef0f2' : '#0e0f11';
} catch (_) { document.documentElement.dataset.uiTheme = 'dark'; } })();
</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
