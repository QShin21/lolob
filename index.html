<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#070b12"/><link rel="icon" href="/brand/favicon.ico" sizes="any"/><link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png"/><link rel="apple-touch-icon" href="/brand/icon-192.png"/><title>RiftCast ARENA · 裂谷导播</title><script>
// Apply the saved appearance before the UI loads. Broadcast outputs retain their palette.
(function () { try {
  var theme = !location.pathname.startsWith('/overlay') && localStorage.getItem('riftcast-ui-theme') === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.uiTheme = theme;
  document.documentElement.style.colorScheme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#eef1f5' : '#070b12';
} catch (_) { document.documentElement.dataset.uiTheme = 'dark'; } })();
</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
