<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>RiftCast 团队画面</title><style>html,body{margin:0;width:100%;height:100%;background:#05090e;color:#c2ceda;font:16px 'Microsoft YaHei',sans-serif;overflow:hidden}video{width:100%;height:100%;object-fit:contain}#status{position:absolute;inset:auto 12px 12px;padding:8px 12px;background:#121e2ee8;border-radius:5px}body.output #status{display:none}</style><video autoplay playsinline muted></video><div id="status" role="status">等待协作画面</div><script>
const query=new URLSearchParams(location.search),video=document.querySelector('video'),label=document.querySelector('#status');
const output=query.get('output')==='1';document.body.classList.toggle('output',output);video.controls=!output;video.muted=!output;
let socket,source,buffer,objectUrl,retry,queue=[],queued=0,stopped=false,lastFrame=0,openedAt=0,starting=true,lastReady=0;
function reportReady(){if(output&&socket?.readyState===1&&Date.now()-lastReady>500){const text=new TextEncoder().encode(JSON.stringify({type:'ready'}));const packet=new Uint8Array(text.length+1);packet.set(text,1);socket.send(packet);lastReady=Date.now()}}
function status(text){label.textContent=text;label.hidden=text==='实时画面';parent.postMessage({type:'riftcast-team-frame',id:query.get('id'),ready:text==='实时画面'},location.origin)}
function clear(){queue=[];queued=0;buffer=undefined;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=undefined;video.removeAttribute('src');video.load();starting=true;lastFrame=0}
function initialize(mime){clear();source=new MediaSource();objectUrl=URL.createObjectURL(source);video.src=objectUrl;source.addEventListener('sourceopen',()=>{try{buffer=source.addSourceBuffer(mime);buffer.addEventListener('updateend',flush);buffer.addEventListener('error',()=>socket?.close());flush()}catch{status('浏览器无法解码该画面');socket?.close()}});status('正在缓冲协作画面');openedAt=Date.now()}
function flush(){if(!buffer||buffer.updating||source.readyState!=='open')return;try{if(buffer.buffered.length){const end=buffer.buffered.end(buffer.buffered.length-1);if(starting||end-video.currentTime>1.5){video.currentTime=Math.max(buffer.buffered.start(0),end-.35);starting=false}if(video.paused)video.play().catch(()=>status('点击播放以查看画面'));if(video.currentTime-buffer.buffered.start(0)>20){buffer.remove(0,video.currentTime-10);return}}if(queue.length){const data=queue.shift();queued-=data.byteLength;buffer.appendBuffer(data)}}catch{socket?.close();status('画面重连中')}}
function connect(){if(stopped)return;const url=new URL('/ws/collaboration',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';url.searchParams.set('token',query.get('token')||'');if(output)url.searchParams.set('output','1');url.searchParams.set('id',query.get('id')||'host');socket=new WebSocket(url);socket.binaryType='arraybuffer';socket.onmessage=e=>{const bytes=new Uint8Array(e.data);if(bytes[0]===0){const event=JSON.parse(new TextDecoder().decode(bytes.subarray(1)));if(event.type==='stream')initialize(event.mime);if(event.type==='ended'){clear();status('画面已停止，等待重新共享')}}else if(bytes[0]===1){const frame=bytes.slice(2+bytes[1]);queued+=frame.byteLength;if(queued>8*1024*1024){socket.close();return}queue.push(frame);lastFrame=Date.now();flush()}};socket.onclose=()=>{clear();status('画面连接中断，正在重连');retry=setTimeout(connect,2000)};socket.onerror=()=>socket.close()}
video.addEventListener('timeupdate',()=>{if(video.readyState>=2&&Date.now()-lastFrame<5000){status('实时画面');reportReady()}});
setInterval(()=>{if(lastFrame&&Date.now()-lastFrame>5000){clear();status('协作画面中断，等待重新共享')}else if(openedAt&&Date.now()-openedAt>12000&&video.readyState<2){socket?.close();openedAt=Date.now()}},1000);
addEventListener('beforeunload',()=>{stopped=true;clearTimeout(retry);socket?.close();clear()});connect();
</script></html>
