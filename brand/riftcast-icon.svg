<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233a"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e0aa"/><stop offset=".45" stop-color="#c8aa6e" stop-opacity=".55"/><stop offset="1" stop-color="#7a6231" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#fbeec5"/><stop offset=".42" stop-color="#d9bc7c"/><stop offset="1" stop-color="#a98646"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fbff"/><stop offset=".4" stop-color="#63d9f2"/><stop offset="1" stop-color="#2a8fe0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="62%" cy="72%" r="46%">
      <stop offset="0" stop-color="#3fc8f0" stop-opacity=".38"/><stop offset="1" stop-color="#3fc8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tally" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ff9aa2"/><stop offset=".5" stop-color="#ff4558"/><stop offset="1" stop-color="#c81d33"/>
    </radialGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bloom)"/>
    <path d="M-40 420 L330 -40 L420 -40 L50 520 Z" fill="#ffffff" opacity=".028"/>
    <path d="M250 520 L560 130 L560 260 L350 520 Z" fill="#5cc8f5" opacity=".05"/>
  </g>
  <rect x="21" y="21" width="470" height="470" rx="103" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- R: stem and bowl -->
  <path fill="url(#gold)" fill-rule="evenodd" d="M124 104 H272 a104 104 0 0 1 0 208 H200 V408 H124 Z M200 172 V246 H268 a37 37 0 0 0 0 -74 Z"/>
  <!-- the rift: the leg is a blade of light -->
  <path fill="url(#arc)" d="M214 330 H318 L412 408 H308 Z"/>
  <path fill="#ffffff" opacity=".5" d="M214 330 H244 L338 408 H308 Z"/>
  <!-- on-air tally -->
  <circle cx="412" cy="108" r="44" fill="#ff4558" opacity=".2"/>
  <circle cx="412" cy="108" r="28" fill="url(#tally)"/>
</svg>
