<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 观澜 mark: the Rift map (three brass lanes, blue and red bases), the river as a wave of arc light (澜),
       and the observer's lens where the river meets mid lane (观). The red base doubles as the on-air tally. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16233a"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#05080e"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e0aa"/><stop offset=".45" stop-color="#c8aa6e" stop-opacity=".55"/><stop offset="1" stop-color="#7a6231" stop-opacity=".9"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#fbeec5"/><stop offset=".45" stop-color="#d9bc7c"/><stop offset="1" stop-color="#a07c3e"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a8fe0"/><stop offset=".4" stop-color="#63d9f2"/><stop offset=".6" stop-color="#e6fbff"/><stop offset="1" stop-color="#3aa6ee"/></linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3fc8f0" stop-opacity=".28"/><stop offset="1" stop-color="#3fc8f0" stop-opacity="0"/></radialGradient>
    <radialGradient id="red" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#ff9aa2"/><stop offset=".5" stop-color="#ff4558"/><stop offset="1" stop-color="#c81d33"/></radialGradient>
    <radialGradient id="blue" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#bfe0ff"/><stop offset=".5" stop-color="#5aa9ff"/><stop offset="1" stop-color="#2468c8"/></radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bloom)"/>
  <rect x="21" y="21" width="470" height="470" rx="103" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- lanes: top, bottom, mid -->
  <g fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 388 V168 a44 44 0 0 1 44 -44 H388"/><path d="M124 388 H344 a44 44 0 0 0 44 -44 V124"/><path d="M124 388 L388 124"/>
  </g>
  <!-- river -->
  <path class="cut" d="M96 120 C150 110 214 150 232 214 S292 318 356 330 S420 376 416 400 C356 408 300 372 280 300 S214 204 156 190 S92 150 96 120 Z" fill="#0a111e" stroke="#0a111e" stroke-width="26" stroke-linejoin="round"/>
  <path d="M96 120 C150 110 214 150 232 214 S292 318 356 330 S420 376 416 400 C356 408 300 372 280 300 S214 204 156 190 S92 150 96 120 Z" fill="url(#arc)"/>
  <!-- observer lens -->
  <circle class="cut" cx="256" cy="256" r="62" fill="#0a111e"/>
  <circle cx="256" cy="256" r="50" fill="#0c1627" stroke="url(#gold)" stroke-width="16"/>
  <circle cx="256" cy="256" r="18" fill="url(#arc)"/>
  <circle cx="249" cy="249" r="5" fill="#fff" opacity=".85"/>
  <!-- bases -->
  <circle class="cut" cx="124" cy="388" r="40" fill="#0a111e"/><circle cx="124" cy="388" r="30" fill="url(#blue)"/>
  <circle class="cut" cx="388" cy="124" r="40" fill="#0a111e"/><circle cx="388" cy="124" r="46" fill="#ff4558" opacity=".2"/><circle cx="388" cy="124" r="30" fill="url(#red)"/>
</svg>
