name: Diagnose collaboration verifier

# Temporary: runs only the paired-collaboration verifier on a hosted Windows runner and keeps its evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated Playwright
        run: |
          $playwright = Join-Path $env:RUNNER_TEMP 'rc-playwright'
          npm install --prefix "$playwright" --no-save --package-lock=false playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RIFTCAST_PLAYWRIGHT_MODULE=$(Join-Path $playwright 'node_modules/playwright/index.mjs')" >> $env:GITHUB_ENV
      - name: Paired collaboration with the runner's Edge
        run: node scripts/verify-collaboration-170.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-diagnosis
          retention-days: 3
          path: verification-output/collaboration-170/**
