name: Style pack development workspace

on:
  push:
    branches: [new]
    paths: ['.github/workflows/style-pack-workspace.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Prepare pinned test fixture (download only)
        run: node scripts/ensure-vbcable.cjs
      - name: Export tracked source and locked Linux development dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/style-pack-workspace"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/style-pack-workspace/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/style-pack-workspace/revision.txt"
          tar -czf "$RUNNER_TEMP/style-pack-workspace/dependencies.tar.gz" node_modules
          if [ -d runtime ]; then
            tar -czf "$RUNNER_TEMP/style-pack-workspace/test-runtime.tar.gz" runtime
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: style-pack-workspace
          path: ${{ runner.temp }}/style-pack-workspace/
          compression-level: 0
          retention-days: 1
