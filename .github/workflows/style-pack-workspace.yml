name: Style pack development workspace

on:
  push:
    branches: [new]
    paths: ['.github/workflows/style-pack-workspace.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Export bounded development files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/style-source" "$RUNNER_TEMP/style-dependencies"
          git archive --format=tar HEAD | python3 -c 'import tarfile,sys; src=tarfile.open(fileobj=sys.stdin.buffer,mode="r|"); dst=tarfile.open(sys.argv[1],"w:gz"); [(dst.addfile(m,src.extractfile(m) if m.isfile() else None)) for m in src if m.size<500000 and not m.name.startswith("docs/evidence/")]; dst.close()' "$RUNNER_TEMP/style-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/style-source/revision.txt"
          tar --exclude='node_modules/electron' --exclude='node_modules/electron-builder' --exclude='node_modules/app-builder-bin' --exclude='node_modules/7zip-bin' -czf "$RUNNER_TEMP/style-dependencies/dependencies.tar.gz" node_modules
          ls -lh "$RUNNER_TEMP/style-source/" "$RUNNER_TEMP/style-dependencies/"
      - uses: actions/upload-artifact@v4
        with:
          name: style-pack-source
          path: ${{ runner.temp }}/style-source/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: style-pack-dependencies
          path: ${{ runner.temp }}/style-dependencies/
          compression-level: 0
          retention-days: 1
