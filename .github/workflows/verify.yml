name: Verify

on:
  push:
    branches: [new]
  pull_request:
    branches: [new]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export reproducible review inputs
        if: github.ref == 'refs/heads/new'
        run: |
          git archive --format=tar HEAD | gzip > /tmp/lolob-review-source.tar.gz
          tar -czf /tmp/lolob-review-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/new'
        with:
          name: lolob-review-inputs
          path: /tmp/lolob-review-*.tar.gz
          retention-days: 1
          compression-level: 0
      - run: npm run check
      - run: npm test
      - run: npm run build
