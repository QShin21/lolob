name: Verify

on:
  push:
    branches: [new, 'work/v0.9.3-ocr-report']
  pull_request:
    branches: [new]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export isolated review dependencies
        if: github.ref == 'refs/heads/work/v0.9.3-ocr-report'
        run: tar czf /tmp/lolob-review-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/work/v0.9.3-ocr-report'
        with:
          name: lolob-review-deps
          path: /tmp/lolob-review-deps.tar.gz
          retention-days: 1
      - run: npm run check
      - run: npm test > /tmp/test-results.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: /tmp/test-results.txt
          retention-days: 7
      - run: npm run build
