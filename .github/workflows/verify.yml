name: Verify

on:
  push:
    branches: [new]
  pull_request:
    branches: [new]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare pinned archive used by driver wrapper tests (download only)
        run: node scripts/ensure-vbcable.cjs
      - run: npm run check
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-output/ci
          npm test 2>&1 | tee verification-output/ci/tests.txt
      - name: Verify report fixture through service restart
        run: node scripts/verify-report-fixture-093.mjs
      - run: npm run build
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-linux
          path: verification-output/ci/tests.txt
          retention-days: 30
