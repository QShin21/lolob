name: Verify

on:
  push:
    branches: [new]
  pull_request:
    branches: [new]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-vbcable.cjs
      - run: npm run check
      - name: Test
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem server -Filter '*.test.ts' | ForEach-Object FullName)
          node --import tsx --test --test-concurrency=1 @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build
