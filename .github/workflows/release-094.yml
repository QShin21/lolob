name: Release 0.9.4

on:
  workflow_dispatch:
  push:
    branches: [new]
    paths: ['.github/workflows/release-094.yml']

permissions:
  contents: write

concurrency:
  group: release-0.9.4
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'QShin21/lolob' && github.ref == 'refs/heads/new'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # One-time source transfer. The reviewed patch is bounded and pinned by SHA-256.
      # After the feature commit removes its payload this step remains a no-op.
      - name: Apply reviewed 0.9.4 source payload
        if: hashFiles('.github/style-pack-094/0.b64') != ''
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD^) -ne '208489627033d97362eb2a1ea9731b2b7fe275c7') { throw 'Unexpected source base' }
          git fetch origin new
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse origin/new) -ne (git rev-parse HEAD)) { throw 'Concurrent branch update; source transfer stopped' }
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path'; import {brotliDecompressSync} from 'node:zlib'; import {createHash} from 'node:crypto'; import assert from 'node:assert/strict'; const encoded=[0,1,2,3].map(i=>fs.readFileSync('.github/style-pack-094/'+i+'.b64','utf8')).join(''); const patch=brotliDecompressSync(Buffer.from(encoded,'base64'),{maxOutputLength:1048576}); assert.equal(createHash('sha256').update(patch).digest('hex'),'4e3c2ee296c10307254ef7c9b3149a07e2a0fdf0d5d176ad393cb0ec3dcc3640'); fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'reviewed-094.patch'),patch);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --index --unidiff-zero --whitespace=error "$env:RUNNER_TEMP/reviewed-094.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --index --whitespace=error .github/style-pack-094/proxy-fix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm -r .github/style-pack-094
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 0.9.4 scene style packs (简陋包)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:new
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify version and source branch
        run: |
          node -e "require('node:assert/strict').equal(require('./package.json').version, '0.9.4')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin new
          if ((git rev-parse origin/new) -ne (git rev-parse HEAD)) { throw 'new advanced concurrently; build its latest revision' }
      - run: npm ci
      - name: Prepare pinned VB-CABLE archive for tests (download only)
        run: node scripts/ensure-vbcable.cjs
      - run: npm run check
      - name: Windows tests including production OCR worker
        timeout-minutes: 15
        run: |
          New-Item -ItemType Directory -Force verification-output/release-0.9.4 | Out-Null
          $tests = @(Get-ChildItem server -Filter '*.test.ts' | ForEach-Object FullName)
          node --import tsx --test --test-concurrency=1 @tests 2>&1 | Tee-Object verification-output/release-0.9.4/tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify report fixture through service restart
        run: node scripts/verify-report-fixture-093.mjs
      - run: npm run build
      - name: Prepare isolated browser test dependency
        run: |
          npm install --prefix "$env:RUNNER_TEMP/rc-playwright" --no-save --package-lock=false playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RIFTCAST_PLAYWRIGHT_MODULE=$env:RUNNER_TEMP/rc-playwright/node_modules/playwright/index.mjs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify report layouts
        run: node scripts/verify-report-093.mjs
      - name: Verify style pack import, preview, all scenes and service restart
        run: npm run verify:style-packs
      - name: Upload report layout review
        uses: actions/upload-artifact@v4
        with:
          name: report-layout-0.9.4
          retention-days: 30
          path: |
            verification-output/release-0.9.3/layout/*.json
            verification-output/release-0.9.3/layout/*.png
            verification-output/release-0.9.4/styles/*.json
            verification-output/release-0.9.4/styles/*.png
      - name: Build Windows Setup and ZIP
        run: npm run release:win
      - name: Verify isolated packaged report
        run: node scripts/verify-packaged-report-094.mjs
      - name: Confirm exact new revision before publication
        run: |
          git fetch origin new
          if ((git rev-parse origin/new) -ne (git rev-parse HEAD)) { throw 'new advanced while building; publication stopped' }
      - name: Publish verified release and check remote digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-094.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-0.9.4
          retention-days: 30
          path: |
            verification-output/release-0.9.4/*.txt
            verification-output/release-0.9.4/*.json
            verification-output/release-0.9.4/*.png
            verification-output/release-0.9.3/layout/*.json
            verification-output/release-0.9.3/layout/*.png
            verification-output/release-0.9.4/styles/*.json
            verification-output/release-0.9.4/styles/*.png
            release/0.9.4/release-manifest.json
            release/0.9.4/SHA256SUMS.txt
